  <p class="lead">中文在正面，官方标准译法在背面。<b>点击卡片翻面</b>，右下角按钮标记「已掌握」（存在本地浏览器）。实务评分里立场性表述译错按严重误译扣 5 分——这些词条就是保分底线。</p>

  <input type="search" id="q" placeholder="搜索中文或英文，如：新质生产力 / low-carbon …">
